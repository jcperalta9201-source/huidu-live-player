
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huidu Live Player</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:white;font-family:Arial,sans-serif;text-align:center;padding:20px}
h1{color:#35d6a0;font-size:28px}
p{color:#bbc5d4}
button,input{width:100%;padding:16px;margin:8px 0;border:0;border-radius:10px;font-size:17px}
button{background:#168b68;color:white;font-weight:bold}
input{background:#202a3b;color:white}
#player{width:100%;aspect-ratio:16/9;background:#000;margin-top:18px}
iframe{width:100%;height:100%;border:0}
.secondary{background:#26364d}
</style>
</head>
<body>
<h1>HUIDU LIVE PLAYER</h1>
<p>Reproductor para pantalla LED HD-A3L</p>

<input id="url" placeholder="Pega aquí el enlace de YouTube">
<button onclick="playVideo()">▶ REPRODUCIR YOUTUBE</button>

<div id="player"></div>

<h3>OTRAS PLATAFORMAS</h3>
<button class="secondary" onclick="openSite('https://www.facebook.com/watch/')">FACEBOOK LIVE</button>
<button class="secondary" onclick="openSite('https://www.nba.com/watch')">NBA LEAGUE PASS</button>

<p>Los servicios oficiales pueden requerir iniciar sesión.</p>

<script>
function playVideo(){
 let url=document.getElementById('url').value.trim();
 let id='';
 try{
  let u=new URL(url);
  if(u.hostname.includes('youtu.be')) id=u.pathname.slice(1);
  else if(u.hostname.includes('youtube.com')){
   id=u.searchParams.get('v') || '';
   if(!id && u.pathname.includes('/embed/')) id=u.pathname.split('/embed/')[1].split('/')[0];
   if(!id && u.pathname.includes('/live/')) id=u.pathname.split('/live/')[1].split('/')[0];
  }
 }catch(e){}
 if(!id){alert('Pega un enlace válido de YouTube');return;}
 document.getElementById('player').innerHTML=
 '<iframe allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen src="https://www.youtube.com/embed/'+encodeURIComponent(id)+'?autoplay=1"></iframe>';
}
function openSite(url){window.open(url,'_blank');}
</script>
</body>
</html>
