
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUIDU LIVE PLAYER</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:16px;
 background:#080d18;color:white;
 font-family:Arial,sans-serif;text-align:center
}
h1{color:#35d6a0;font-size:28px}
p{color:#bbc5d4}
input,button{
 width:100%;padding:15px;margin:7px 0;
 border:0;border-radius:9px;font-size:17px
}
input{background:#202a3b;color:white}
button{background:#168b68;color:white;font-weight:bold}
.secondary{background:#26364d}
#player{
 width:100%;aspect-ratio:16/9;
 background:#000;margin-top:15px
}
iframe{width:100%;height:100%;border:0}
</style>
</head>
<body>

<h1>HUIDU LIVE PLAYER</h1>
<p>Reproductor para pantalla LED HD-A3L</p>

<h3>YOUTUBE LIVE</h3>
<input id="yt" placeholder="Pega enlace de YouTube">
<button onclick="playYoutube()">▶ REPRODUCIR YOUTUBE</button>

<h3>FACEBOOK LIVE</h3>
<input id="fb" placeholder="Pega enlace público de Facebook">
<button class="secondary" onclick="playFacebook()">▶ REPRODUCIR FACEBOOK</button>

<h3>NBA LEAGUE PASS</h3>
<button class="secondary" onclick="openNBA()">▶ ABRIR NBA LEAGUE PASS</button>

<div id="player"></div>

<p id="status">Selecciona una plataforma para reproducir</p>

<script>
const player=document.getElementById('player');
const status=document.getElementById('status');

function playYoutube(){
 let url=document.getElementById('yt').value.trim();
 let id='';
 try{
  let u=new URL(url);
  if(u.hostname.includes('youtu.be'))
   id=u.pathname.slice(1).split('/')[0];
  else if(u.hostname.includes('youtube.com')){
   id=u.searchParams.get('v')||'';
   if(!id) id=u.pathname.match(/\/(live|embed|shorts)\/([^/]+)/)?.[2]||'';
  }
 }catch(e){}

 if(!id){
  status.textContent='Enlace de YouTube no válido';
  return;
 }

 player.innerHTML='';
 let f=document.createElement('iframe');
 f.src='https://www.youtube.com/embed/'+encodeURIComponent(id)+'?autoplay=1';
 f.allow='autoplay; encrypted-media; picture-in-picture';
 f.allowFullscreen=true;
 player.appendChild(f);
 status.textContent='YouTube: intentando reproducir';
}


function playFacebook(){
  let url = document.getElementById('fb').value.trim();

  try {
    if(!url) {
      throw new Error('Pega un enlace de Facebook');
    }

    let u = new URL(url);

    if(!/(^|\.)facebook\.com$/.test(u.hostname)) {
      throw new Error('El enlace no es de Facebook');
    }

    player.innerHTML = '';

    let f = document.createElement('iframe');

    f.src = 'https://www.facebook.com/plugins/video.php?href='
      + encodeURIComponent(url)
      + '&show_text=false&width=1280&autoplay=false';

    f.style.width = '100%';
    f.style.height = '100%';
    f.style.border = '0';

    f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    f.allowFullscreen = true;

    player.appendChild(f);

    status.textContent =
      'Facebook: cargando reproductor oficial...';

  } catch(e) {
    status.textContent = e.message || 'Revisa el enlace de Facebook';
  }
}


function openNBA(){
 status.textContent='Abriendo NBA League Pass oficial';
 window.location.href='https://www.nba.com/watch';
}
</script>

</body>
</html>
